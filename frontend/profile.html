<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil · File Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { sans: ['Geist','system-ui','sans-serif'], mono: ['Geist Mono','monospace'] },
      colors: { ink: '#08080b', surface: '#101014', elevated: '#16161c' },
    } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="min-h-screen">
  <div id="navbar"></div>

  <main class="max-w-5xl mx-auto px-5 pt-8 pb-24">
    <!-- Header -->
    <div class="mb-7 animate-fade-up">
      <span class="font-mono text-[11px] tracking-widest uppercase text-[#7a7a86]">Compte</span>
      <h1 class="text-[28px] font-semibold tracking-tight mt-1">Mon profil</h1>
    </div>

    <!-- Identity card -->
    <section id="identity" class="card p-6 sm:p-7 mb-6 animate-fade-up" style="animation-delay:.04s"></section>

    <!-- Stats -->
    <section class="mb-6 animate-fade-up" style="animation-delay:.08s">
      <h2 class="text-[15px] font-semibold text-[#e2e2e9] mb-3.5">Mon activité</h2>
      <div id="stats-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-3.5"></div>
    </section>

    <!-- Detail row: chart + highlights -->
    <section class="grid lg:grid-cols-[1.3fr_1fr] gap-3.5 animate-fade-up" style="animation-delay:.12s">
      <div id="chart-card" class="card p-5 sm:p-6"></div>
      <div id="highlights-card" class="card p-5 sm:p-6"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/components.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
