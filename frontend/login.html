<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion · File Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Geist','system-ui','sans-serif'], mono: ['Geist Mono','monospace'] },
        colors: { ink: '#08080b', surface: '#101014', elevated: '#16161c' },
      } }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <template id="__bundler_thumbnail" data-bg-color="#08080b">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#5b8def"/>
        </linearGradient>
      </defs>
      <rect width="1200" height="800" fill="#08080b"/>
      <rect x="500" y="300" width="200" height="200" rx="48" fill="url(#g)"/>
      <g stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M575 360l-30 30 30 30M545 390h70a40 40 0 0 1 40 40"/>
        <path d="M625 480l30-30-30-30M655 450h-70" opacity="0.55"/>
      </g>
    </svg>
  </template>
</head>
<body class="min-h-screen flex flex-col">

  <main class="flex-1 grid place-items-center px-5 py-12">
    <div class="w-full max-w-[400px] animate-fade-up">

      <!-- Brand -->
      <div class="flex flex-col items-center text-center mb-9">
        <div id="brand" class="mb-5"></div>
        <h1 class="text-[26px] font-semibold tracking-tight">Bon retour</h1>
        <p class="text-[#8a8a96] text-sm mt-1.5">Connectez-vous pour convertir vos fichiers.</p>
      </div>

      <!-- Card -->
      <div class="card p-6 sm:p-7 shadow-2xl">
        <form id="login-form" class="space-y-4" novalidate>
          <div>
            <label for="email" class="block text-[13px] font-medium text-[#c7c7d0] mb-1.5">Adresse e-mail</label>
            <input id="email" type="email" autocomplete="email" required
              class="field w-full rounded-xl px-3.5 py-2.5 text-sm" placeholder="vous@exemple.com" value="alice@test.com" />
          </div>
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="password" class="block text-[13px] font-medium text-[#c7c7d0]">Mot de passe</label>
              <a href="#" class="text-[12px] text-[#7a7a86] hover:text-[#b9b9c4] transition-colors">Oublié ?</a>
            </div>
            <div class="relative">
              <input id="password" type="password" autocomplete="current-password" required
                class="field w-full rounded-xl px-3.5 py-2.5 pr-11 text-sm" placeholder="••••••••" value="password" />
              <button type="button" id="toggle-pw" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[#5c5c66] hover:text-[#b9b9c4] transition-colors p-1" aria-label="Afficher le mot de passe">
                <svg viewBox="0 0 20 20" class="w-4.5 h-4.5" width="18" height="18" fill="none"><path d="M2.5 10S5 4.5 10 4.5 17.5 10 17.5 10 15 15.5 10 15.5 2.5 10 2.5 10Z" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.25" stroke="currentColor" stroke-width="1.5"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" id="submit-btn"
            class="btn-primary w-full rounded-xl py-2.5 text-sm font-semibold flex items-center justify-center gap-2 mt-1">
            <span class="btn-label">Se connecter</span>
            <span class="btn-spin spinner w-4 h-4 hidden"></span>
          </button>
        </form>
      </div>

      <p class="text-center text-[12px] text-[#5c5c66] mt-5 leading-relaxed">
        Mode démo actif — utilisez <span class="font-mono text-[#9a9aa6]">admin@test.com</span> pour accéder au panneau admin.
      </p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/components.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
